<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="assets/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harmoni – Histórico</title>
<link rel="stylesheet" href="harmoni.css">
<script src="menu.js" defer></script>
<style>

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: rgba(255,255,255,0.4);
}

.empty-state .icon { font-size: 48px; margin-bottom: 16px; }
.empty-state h3    { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.6); }
.empty-state p     { font-size: 14px; margin-bottom: 24px; }

.report-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 18px 22px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  cursor: pointer;
  transition: background 0.2s ease;
}

.report-row:last-child { border-bottom: none; }
.report-row:hover { background: rgba(255,255,255,0.05); }

.report-row .rr-date  { font-size: 14px; color: #fff; font-weight: 500; }
.report-row .rr-score { font-size: 13px; color: rgba(255,255,255,0.6); }

</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><img src="assets/logo.png" alt="Harmoni"></div>
  <div class="menu">
    <a href="index.html">Dashboard</a>
    <a href="chat.html">Nova Análise</a>
    <a href="indicadores.html">Indicadores</a>
    <a href="historico.html" class="active">Relatórios</a>
  </div>
  <div class="topbar-user"><span>Olá, <span data-user-name>Colaborador</span></span></div>
</div>

<div class="container">

  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;flex-wrap:wrap;gap:12px">
    <div>
      <div class="page-title" style="margin-bottom:4px">Seus Relatórios</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6)" id="subtitulo">Carregando...</div>
    </div>
    <button class="btn btn-primary" onclick="location.href='chat.html'">+ Nova Análise</button>
  </div>

  <div class="card" id="cardRelatorios" style="padding:0">
    <div class="empty-state">
      <div class="icon">📄</div>
      <h3>Nenhum relatório ainda</h3>
      <p>Seus relatórios aparecerão aqui após a primeira análise emocional.</p>
      <button class="btn btn-primary" onclick="location.href='chat.html'">Fazer primeira análise</button>
    </div>
  </div>

  <div class="footer">Harmoni © 2026</div>
</div>

<script src="auth.js"></script>
<script>
HarmoniAuth.requireAuth();
HarmoniAuth.fillUserName();

async function carregarRelatorios() {
  const subtitulo = document.getElementById('subtitulo');
  const card = document.getElementById('cardRelatorios');
  try {
    const res  = await HarmoniAuth.fetch('/reports');
    const reports = await res.json();
    if (!res.ok) throw new Error(reports.error || 'Erro ao carregar relatórios.');

    if (reports.length === 0) {
      subtitulo.textContent = 'Nenhuma sessão realizada ainda';
      return;
    }

    subtitulo.textContent = `${reports.length} relatório(s) gerado(s)`;
    card.style.padding = '0';
    card.innerHTML = reports.map((r) => `
      <div class="report-row" onclick="location.href='relatorio.html?id=${r.id}'">
        <div>
          <div class="rr-date">${new Date(r.created_at).toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' })}</div>
          <div class="rr-score">Índice geral: ${r.score_geral}</div>
        </div>
        <span class="btn btn-ghost btn-sm">Ver relatório →</span>
      </div>
    `).join('');
  } catch (err) {
    subtitulo.textContent = 'Não foi possível carregar seus relatórios.';
    console.error(err);
  }
}

carregarRelatorios();
</script>
</body>
</html>
