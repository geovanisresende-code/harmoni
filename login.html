<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harmoni – Acesso</title>
<link rel="stylesheet" href="harmoni.css">
<style>

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-wrap {
  width: 100%;
  max-width: 400px;
  padding: 20px;
}

@media (max-width: 480px) {
  body {
    align-items: flex-start;
    padding: 24px 0 40px;
    background-attachment: scroll; /* iOS fix */
  }

  .login-wrap {
    padding: 16px;
  }

  .login-box {
    padding: 32px 22px 28px;
  }
}

.login-box {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px;
  padding: 40px 36px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.2);
}

.login-logo {
  display: block;
  width: 180px;
  margin: 0 auto 28px;
  filter:
    drop-shadow(0 0 3px rgba(255,255,255,1))
    drop-shadow(0 0 8px rgba(255,240,180,0.95))
    drop-shadow(0 0 20px rgba(255,210,120,0.8))
    drop-shadow(0 0 35px rgba(255,180,80,0.5));
}

.login-title {
  text-align: center;
  font-size: 18px;
  font-weight: 600;
  color: rgba(255,255,255,0.85);
  margin-bottom: 28px;
}

.tab-toggle {
  display: flex;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 24px;
  gap: 4px;
}

.tab-btn {
  flex: 1;
  padding: 9px;
  border: none;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  background: transparent;
  color: rgba(255,255,255,0.5);
}

.tab-btn.active {
  background: linear-gradient(90deg, #ff7a18, #ffb347);
  color: #fff;
}

.form-section { display: none; }
.form-section.active { display: block; }

.divider {
  text-align: center;
  color: rgba(255,255,255,0.35);
  font-size: 12px;
  margin: 16px 0;
  position: relative;
}

.divider::before,
.divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 40%;
  height: 1px;
  background: rgba(255,255,255,0.12);
}

.divider::before { left: 0; }
.divider::after  { right: 0; }

.forgot {
  text-align: right;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  margin-top: -10px;
  margin-bottom: 16px;
  cursor: pointer;
}

.forgot:hover { color: #ff6f91; }

.footer-login {
  margin-top: 20px;
  text-align: center;
  font-size: 11px;
  color: rgba(255,255,255,0.35);
}

/* Inputs para o login (sobrescreve o padrão da classe form-input para o contexto de login) */
.login-box .form-input {
  background: rgba(255,255,255,0.1);
  border-color: rgba(255,255,255,0.18);
}

</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-box">

    <img src="assets/logo.png" alt="Harmoni" class="login-logo">
    <div class="login-title">Bem-vindo à Harmoni</div>

    <!-- Tabs -->
    <div class="tab-toggle">
      <button class="tab-btn active" id="tabEntrar" onclick="switchTab('entrar')">Entrar</button>
      <button class="tab-btn" id="tabCadastro" onclick="switchTab('cadastro')">Cadastrar</button>
    </div>

    <!-- Entrar -->
    <div class="form-section active" id="formEntrar">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" class="form-input" placeholder="seu@email.com" id="loginEmail">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" class="form-input" placeholder="••••••••" id="loginSenha">
      </div>
      <div class="forgot">Esqueci minha senha</div>
      <button class="btn btn-primary btn-full btn-lg btn-login-submit" onclick="fazerLogin()">Entrar</button>
      <div class="divider">ou acesse como</div>
      <button class="btn btn-ghost btn-full" onclick="entrarComoRH()">👤 Gestor de RH / Empresa</button>
    </div>

    <!-- Cadastro -->
    <div class="form-section" id="formCadastro">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input type="text" class="form-input" placeholder="Seu nome">
      </div>
      <div class="form-group">
        <label class="form-label">E-mail corporativo</label>
        <input type="email" class="form-input" placeholder="seu@empresa.com">
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" class="form-input" placeholder="Mínimo 8 caracteres">
      </div>
      <button class="btn btn-primary btn-full btn-lg">Criar Conta</button>
    </div>

    <div class="footer-login">Harmoni © 2026 · Dados protegidos com criptografia de ponta a ponta</div>
  </div>
</div>

<script src="auth.js"></script>
<script>
// Se já está logado, vai direto pro dashboard
if (HarmoniAuth.getUser()) window.location.href = 'index.html';

function switchTab(tab) {
  document.getElementById('tabEntrar').classList.toggle('active', tab === 'entrar');
  document.getElementById('tabCadastro').classList.toggle('active', tab === 'cadastro');
  document.getElementById('formEntrar').classList.toggle('active', tab === 'entrar');
  document.getElementById('formCadastro').classList.toggle('active', tab === 'cadastro');
}

function entrarComoRH() {
  HarmoniAuth.login({ name: 'Empresa XYZ', email: 'rh@empresa.com', role: 'rh', token: 'mock-rh' });
  window.location.href = 'dashboard-rh.html';
}

async function fazerLogin() {
  const email = document.getElementById('loginEmail').value;
  const senha = document.getElementById('loginSenha').value;
  if (!email || !senha) { alert('Preencha e-mail e senha.'); return; }

  const btn = document.querySelector('.btn-login-submit');
  if (btn) { btn.textContent = 'Entrando...'; btn.disabled = true; }

  try {
    // Tenta API real
    await HarmoniAuth.loginAPI(email, senha);
    window.location.href = 'index.html';
  } catch (err) {
    // Fallback mock (remover quando backend estiver no ar)
    if (err.message.includes('fetch') || err.message.includes('Failed')) {
      const nome = email.split('@')[0];
      const nomeFmt = nome.charAt(0).toUpperCase() + nome.slice(1);
      HarmoniAuth.login({ name: nomeFmt, email, role: 'collaborator', token: 'mock' });
      window.location.href = 'index.html';
    } else {
      alert(err.message);
      if (btn) { btn.textContent = 'Entrar'; btn.disabled = false; }
    }
  }
}
</script>
</body>
</html>
