<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harmoni – Gestão de Colaboradores</title>
<link rel="stylesheet" href="harmoni.css">
<script src="menu.js" defer></script>
<style>

/* ── Barra de busca + filtros ── */
.toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.search-wrap {
  flex: 1;
  min-width: 200px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  padding: 12px 15px 12px 40px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 14px;
  outline: none;
}

.search-wrap input::placeholder { color: rgba(255,255,255,0.45); }
.search-wrap input:focus { border-color: #ff6f91; }

.search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: rgba(255,255,255,0.5);
  font-size: 15px;
  pointer-events: none;
}

/* ── Card colaborador ── */
.collab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.collab-card {
  background: rgba(255,255,255,0.13);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 18px;
  padding: 22px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.collab-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 36px rgba(0,0,0,0.14);
}

.collab-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}

.collab-avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.collab-card-name { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 2px; }
.collab-card-role { font-size: 12px; color: rgba(255,255,255,0.5); }
.collab-card-email { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 1px; }

.collab-metrics {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.metric-pill {
  flex: 1;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.metric-pill .val { font-size: 18px; font-weight: 700; color: #fff; }
.metric-pill .lbl { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }

.collab-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ── Modal de convite ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(6px);
  z-index: 2000;
  align-items: center;
  justify-content: center;
}

.modal-overlay.open { display: flex; }

.modal {
  background: rgba(30,15,50,0.95);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 36px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}

.modal h3 { font-size: 20px; color: #fff; margin-bottom: 6px; }
.modal p  { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 24px; }

.modal-close {
  float: right;
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  font-size: 22px;
  cursor: pointer;
  margin-top: -4px;
}

.modal-close:hover { color: #fff; }

</style>
</head>
<body>

<!-- TOPBAR RH -->
<div class="topbar">
  <div class="logo">
    <img src="assets/logo.png" alt="Harmoni">
  </div>
  <div class="menu menu-rh">
    <a href="dashboard-rh.html">Visão Geral</a>
    <a href="colaboradores.html" class="active">Colaboradores</a>
    <a href="billing.html">Assinatura</a>
  </div>
  <div class="topbar-user">
    <span class="badge badge-blue" style="margin-right:6px">RH</span>
    <span>Empresa XYZ</span>
  </div>
</div>

<!-- CONTEÚDO -->
<div class="container">

  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;flex-wrap:wrap;gap:12px">
    <div>
      <div class="page-title" style="margin-bottom:4px">Gestão de Colaboradores</div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6)">48 colaboradores · 42 ativos · 6 em risco</div>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('modalConvite').classList.add('open')">
      + Convidar Colaborador
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar por nome, time ou cargo..." oninput="filtrar()">
    </div>
    <select class="form-select" id="filterStatus" onchange="filtrar()" style="width:auto;padding:11px 14px">
      <option value="">Todos os status</option>
      <option value="ativo">Ativos</option>
      <option value="risco">Em risco</option>
      <option value="inativo">Inativos</option>
    </select>
    <select class="form-select" id="filterTime" onchange="filtrar()" style="width:auto;padding:11px 14px">
      <option value="">Todos os times</option>
      <option value="Engenharia">Engenharia</option>
      <option value="Vendas">Vendas</option>
      <option value="Suporte">Suporte</option>
      <option value="Design">Design</option>
      <option value="Produto">Produto</option>
    </select>
  </div>

  <!-- Cards de colaboradores -->
  <div class="collab-grid" id="collabGrid"></div>

  <div class="footer">Harmoni © 2026 · Gestão de Colaboradores</div>
</div>

<!-- MODAL DE CONVITE -->
<div class="modal-overlay" id="modalConvite">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('modalConvite').classList.remove('open')">×</button>
    <h3>Convidar Colaborador</h3>
    <p>O colaborador receberá um e-mail com instruções de acesso à plataforma.</p>

    <div class="form-group">
      <label class="form-label">Nome completo</label>
      <input type="text" class="form-input" placeholder="Ex: Maria Fernanda">
    </div>
    <div class="form-group">
      <label class="form-label">E-mail corporativo</label>
      <input type="email" class="form-input" placeholder="maria@empresa.com">
    </div>
    <div class="form-group">
      <label class="form-label">Cargo</label>
      <input type="text" class="form-input" placeholder="Ex: Analista de Dados">
    </div>
    <div class="form-group">
      <label class="form-label">Time</label>
      <select class="form-select">
        <option>Engenharia</option>
        <option>Vendas</option>
        <option>Suporte</option>
        <option>Design</option>
        <option>Produto</option>
        <option>Marketing</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn btn-ghost btn-full" onclick="document.getElementById('modalConvite').classList.remove('open')">Cancelar</button>
      <button class="btn btn-primary btn-full" onclick="enviarConvite()">Enviar Convite</button>
    </div>
  </div>
</div>

<script>
const colaboradores = [
  { nome:"Ana Lima", cargo:"Dev Senior", email:"ana@empresa.com", time:"Engenharia", indice:42, risco:"Alto", status:"risco", cor:"linear-gradient(135deg,#ff6f91,#ff9472)", ini:"AL", ultima:"25/05/2026" },
  { nome:"Roberto Souza", cargo:"SDR", email:"roberto@empresa.com", time:"Vendas", indice:51, risco:"Alto", status:"risco", cor:"linear-gradient(135deg,#2bb0e6,#74d7f7)", ini:"RS", ultima:"24/05/2026" },
  { nome:"Juliana Matos", cargo:"CS", email:"juliana@empresa.com", time:"Suporte", indice:55, risco:"Moderado", status:"risco", cor:"linear-gradient(135deg,#ff7a18,#ffb347)", ini:"JM", ultima:"22/05/2026" },
  { nome:"Carlos Andrade", cargo:"Dev Pleno", email:"carlos@empresa.com", time:"Engenharia", indice:74, risco:"Baixo", status:"ativo", cor:"linear-gradient(135deg,#2ecc71,#a8e063)", ini:"CA", ultima:"20/05/2026" },
  { nome:"Fernanda Silva", cargo:"UX Designer", email:"fernanda@empresa.com", time:"Design", indice:82, risco:"Baixo", status:"ativo", cor:"linear-gradient(135deg,#9b59b6,#d7b8f3)", ini:"FS", ultima:"19/05/2026" },
  { nome:"Thiago Rocha", cargo:"Product Manager", email:"thiago@empresa.com", time:"Produto", indice:78, risco:"Baixo", status:"ativo", cor:"linear-gradient(135deg,#1abc9c,#76d7c4)", ini:"TR", ultima:"21/05/2026" },
  { nome:"Mariana Costa", cargo:"Analista", email:"mariana@empresa.com", time:"Suporte", indice:63, risco:"Moderado", status:"ativo", cor:"linear-gradient(135deg,#e67e22,#f0b27a)", ini:"MC", ultima:"18/05/2026" },
  { nome:"Lucas Pereira", cargo:"Dev Junior", email:"lucas@empresa.com", time:"Engenharia", indice:71, risco:"Baixo", status:"ativo", cor:"linear-gradient(135deg,#3498db,#85c1e9)", ini:"LP", ultima:"23/05/2026" },
];

function getBadge(risco) {
  if (risco === "Alto")     return '<span class="badge badge-red">Alto Risco</span>';
  if (risco === "Moderado") return '<span class="badge badge-yellow">Moderado</span>';
  return '<span class="badge badge-green">Saudável</span>';
}

function getIndiceColor(v) {
  if (v < 55) return '#e74c3c';
  if (v < 70) return '#f1c40f';
  return '#2ecc71';
}

function renderCards(lista) {
  const grid = document.getElementById('collabGrid');
  if (lista.length === 0) {
    grid.innerHTML = '<p style="color:rgba(255,255,255,0.5);grid-column:1/-1;text-align:center;padding:40px">Nenhum colaborador encontrado.</p>';
    return;
  }
  grid.innerHTML = lista.map(c => `
    <div class="collab-card">
      <div class="collab-header">
        <div class="collab-avatar" style="background:${c.cor}">${c.ini}</div>
        <div>
          <div class="collab-card-name">${c.nome}</div>
          <div class="collab-card-role">${c.cargo} · ${c.time}</div>
          <div class="collab-card-email">${c.email}</div>
        </div>
      </div>
      <div class="collab-metrics">
        <div class="metric-pill">
          <div class="val" style="color:${getIndiceColor(c.indice)}">${c.indice}%</div>
          <div class="lbl">Índice</div>
        </div>
        <div class="metric-pill">
          <div class="val" style="font-size:13px">${c.risco}</div>
          <div class="lbl">Risco</div>
        </div>
        <div class="metric-pill">
          <div class="val" style="font-size:12px">${c.ultima}</div>
          <div class="lbl">Última sessão</div>
        </div>
      </div>
      <div class="collab-footer">
        ${getBadge(c.risco)}
        <button class="btn btn-sm btn-ghost">Ver Relatório</button>
      </div>
    </div>
  `).join('');
}

function filtrar() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const time   = document.getElementById('filterTime').value;

  const filtrado = colaboradores.filter(c => {
    const matchSearch = c.nome.toLowerCase().includes(search) || c.time.toLowerCase().includes(search) || c.cargo.toLowerCase().includes(search);
    const matchStatus = !status || c.status === status;
    const matchTime   = !time   || c.time === time;
    return matchSearch && matchStatus && matchTime;
  });

  renderCards(filtrado);
}

function enviarConvite() {
  document.getElementById('modalConvite').classList.remove('open');
  // integração com backend aqui
  alert('Convite enviado com sucesso!');
}

// Init
renderCards(colaboradores);
</script>
</body>
</html>
