<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="assets/favicon.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harmoni – Nova Análise</title>
<link rel="stylesheet" href="harmoni.css">
<script src="menu.js" defer></script>
<style>

.chat-container {
  padding: 110px 25px 110px;
  max-width: 860px;
  margin: auto;
}

.chat-header {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.ai-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  flex-shrink: 0;
  overflow: hidden;
}

.ai-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
}

.ai-status { flex: 1; }
.ai-name   { font-size: 14px; font-weight: 600; color: #fff; }
.ai-online { font-size: 12px; color: #2ecc71; }

.chat-box {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 20px;
  padding: 24px;
  min-height: 420px;
  max-height: 55vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 78%;
  padding: 13px 17px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.55;
}

.user-msg {
  background: linear-gradient(135deg, #ff7a18, #ffb347);
  color: #fff;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.bot-msg {
  background: rgba(255,255,255,0.18);
  color: #fff;
  border-bottom-left-radius: 5px;
}

.bot-msg .bot-label {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  margin-bottom: 5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.typing {
  display: flex;
  gap: 5px;
  padding: 14px 18px;
  background: rgba(255,255,255,0.12);
  border-radius: 18px;
  border-bottom-left-radius: 5px;
  width: fit-content;
}

.typing span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,0.5);
  animation: blink 1.2s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%,80%,100% { opacity: 0.3; }
  40%         { opacity: 1; }
}

/* Input area */
.input-area {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  max-width: 860px;
  padding: 16px 0 24px;
  background: transparent;
}

.input-box {
  display: flex;
  gap: 10px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 16px;
  padding: 10px 10px 10px 18px;
  align-items: center;
}

.input-box input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-size: 14px;
  color: #fff;
  padding: 4px 0;
}

.input-box input::placeholder { color: rgba(255,255,255,0.4); }

.input-btns { display: flex; gap: 8px; }

</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><img src="assets/logo.png" alt="Harmoni"></div>
  <div class="menu">
    <a href="index.html">Dashboard</a>
    <a href="chat.html" class="active">Nova Análise</a>
    <a href="indicadores.html">Indicadores</a>
    <a href="historico.html">Relatórios</a>
  </div>
  <div class="topbar-user"><span>Olá, <span data-user-name>Colaborador</span></span></div>
</div>

<div class="chat-container">

  <div class="chat-header">
    <div class="ai-avatar"><img src="assets/mauricio.png" alt="Maurício"></div>
    <div class="ai-status">
      <div class="ai-name">Maurício</div>
      <div class="ai-online">● Online · Análise emocional ativa</div>
    </div>
    <button class="btn btn-sm btn-ghost" onclick="encerrarSessao()">Encerrar sessão</button>
  </div>

  <div class="chat-box" id="chatBox"></div>

</div>

<!-- Input -->
<div class="input-area">
  <div class="input-box">
    <input type="text" id="userInput" placeholder="Escreva como você está se sentindo..." onkeydown="if(event.key==='Enter') enviar()">
    <div class="input-btns">
      <button class="btn btn-secondary btn-sm" onclick="enviar()">Enviar</button>
      <button class="btn btn-accent btn-sm" onclick="gerarRelatorio()">📋 Relatório</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const user = HarmoniAuth.requireAuth();
HarmoniAuth.fillUserName();

let sessionId = null;
let enviando  = false;

function addMessage(role, text) {
  const chatBox = document.getElementById('chatBox');
  const msg = document.createElement('div');
  msg.className = `message ${role === 'user' ? 'user-msg' : 'bot-msg'}`;
  if (role === 'bot') {
    const label = document.createElement('div');
    label.className = 'bot-label';
    label.innerText = 'Maurício';
    msg.appendChild(label);
  }
  const span = document.createElement('span');
  span.innerText = text;
  msg.appendChild(span);
  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  const chatBox = document.getElementById('chatBox');
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.id = 'typingIndicator';
  typing.innerHTML = '<span></span><span></span><span></span>';
  chatBox.appendChild(typing);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function hideTyping() {
  const typing = document.getElementById('typingIndicator');
  if (typing) typing.remove();
}

async function iniciarSessao() {
  showTyping();
  try {
    const res  = await HarmoniAuth.fetch('/sessions', { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro ao iniciar sessão.');
    sessionId = data.sessionId;
    hideTyping();
    addMessage('bot', data.message);
  } catch (err) {
    hideTyping();
    addMessage('bot', `Não consegui iniciar a sessão agora. Tente recarregar a página. (${err.message})`);
  }
}

async function enviar() {
  if (enviando || !sessionId) return;

  const input = document.getElementById('userInput');
  const texto = input.value.trim();
  if (!texto) return;

  addMessage('user', texto);
  input.value = '';
  enviando = true;
  showTyping();

  try {
    const res  = await HarmoniAuth.fetch(`/sessions/${sessionId}/message`, {
      method: 'POST',
      body: JSON.stringify({ message: texto })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro ao enviar mensagem.');
    hideTyping();
    addMessage('bot', data.reply);
  } catch (err) {
    hideTyping();
    addMessage('bot', `Houve um erro ao falar com a IA. Tente novamente. (${err.message})`);
  } finally {
    enviando = false;
  }
}

async function gerarRelatorio() {
  if (!sessionId) return;

  const chatBox = document.getElementById('chatBox');
  const notif = document.createElement('div');
  notif.style.cssText = 'text-align:center;color:rgba(255,255,255,0.6);font-size:13px;padding:8px';
  notif.innerText = '📊 Gerando relatório com base na sessão...';
  chatBox.appendChild(notif);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res  = await HarmoniAuth.fetch(`/sessions/${sessionId}/finish`, { method: 'POST' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erro ao gerar relatório.');
    window.location.href = `relatorio.html?id=${data.reportId}`;
  } catch (err) {
    notif.innerText = `Não foi possível gerar o relatório agora. (${err.message})`;
  }
}

function encerrarSessao() {
  if (confirm('Encerrar sessão e voltar ao dashboard?')) {
    window.location.href = 'index.html';
  }
}

iniciarSessao();
</script>
</body>
</html>
